name: Daily GitHub Trending Email

on:
  schedule:
    # 台灣時間每日上午 06:43 (UTC+8) = 前一日 22:43 UTC
    - cron: '43 22 * * *'
  workflow_dispatch: # 支援手動於 GitHub Actions 網頁點擊 Run workflow 立即測試

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許將每日報告 archive 與 7 天去重紀錄 history.json 寫回倉庫

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install --quiet requests beautifulsoup4

      - name: Run GitHub Trending Daily Crawler
        env:
          PYTHONUNBUFFERED: "1"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOP_N: "10"
          DEDUP_DAYS: "7"
          SMTP_MAX_RETRIES: "12"
          SMTP_RETRY_DELAY: "15"
        run: |
          python github_trending_daily.py

      - name: Commit and Push Archive & History Files
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add archive/ 2>/dev/null || true
          if [ -f "history.json" ]; then
            git add history.json
          fi

          if ! git diff --staged --quiet; then
            git commit -m "Auto-archive GitHub trending report for $(TZ=Asia/Taipei date +'%Y-%m-%d')"
            git checkout -- .
            git pull --rebase origin main
            git push origin main
          else
            echo "No new archive or history files to commit."
          fi
